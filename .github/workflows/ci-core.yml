name: CI Core - Forge App Tests

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "atlassian/forge-app/**"
      - "tools/**"
      - "docs/**"
      - ".github/workflows/**"
      - ".github/scripts/**"
  push:
    branches: [main, develop]
    paths:
      - "atlassian/forge-app/**"
      - "tools/**"
      - "docs/**"
      - ".github/workflows/**"
      - ".github/scripts/**"

permissions:
  contents: read

jobs:
  forge-app-tests:
    name: Forge App Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: "atlassian/forge-app/package-lock.json"

      - name: Install dependencies (forge-app)
        working-directory: atlassian/forge-app
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run tests (forge-app)
        working-directory: atlassian/forge-app
        run: |
          set -euo pipefail
          npm test

      - name: Validate docs (optional)
        run: |
          set -euo pipefail
          if [ -f tools/validate_docs.sh ]; then
            bash tools/validate_docs.sh
          else
            echo "[SKIP] tools/validate_docs.sh not found"
          fi
