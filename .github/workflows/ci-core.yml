name: CI Core - Forge App Tests

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "atlassian/forge-app/**"
      - "tools/**"
      - "docs/**"
      - ".github/workflows/**"
      - ".github/scripts/**"
  push:
    paths:
      - "atlassian/forge-app/**"
      - "tools/**"
      - "docs/**"
      - ".github/workflows/**"
      - ".github/scripts/**"
      - "!atlassian/forge-app/docs/**"
      - "!.github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forge-app-tests:
    name: Forge App Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: "atlassian/forge-app/package-lock.json"

      - name: Verify lockfile exists (fast fail)
        working-directory: atlassian/forge-app
        run: |
          set -euo pipefail
          test -f package-lock.json || {
            echo "ERROR: package-lock.json missing"
            echo "Reproducible installs require a lockfile."
            echo "Run: npm install (to generate lockfile)"
            exit 1
          }

      - name: Run cold-install proof (deterministic validation - single source)
        working-directory: atlassian/forge-app
        run: |
          set -euo pipefail
          bash tools/prove_clean_install.sh

      - name: Verify repo clean after proof (must not dirty working tree)
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE:-.}"
          if [ -n "$(git status --porcelain)" ]; then
            echo "ERROR: Working tree dirty after CI proof run"
            echo "Changes detected:"
            git status --porcelain
            git diff || true
            exit 1
          fi
          echo "OK: repo clean after proof"

      - name: Verify UI naming contract (enforce non-bypassable)
        working-directory: atlassian/forge-app
        run: |
          set -euo pipefail
          bash tools/verify_ui_naming_contract.sh

      - name: Verify Layer-0 Backbone infrastructure (non-bypassable gate)
        working-directory: atlassian/forge-app
        run: |
          set -euo pipefail
          npm run verify:backbone:l0

      - name: Run tests (forge-app)
        working-directory: atlassian/forge-app
        run: |
          set -euo pipefail
          npm test

      - name: Setup Python for audit
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Run enterprise audit v3.1 (F100 offline - 5x stability)
        working-directory: atlassian/forge-app
        run: |
          set -euo pipefail
          bash tools/audit/v3_1/run_stability_5x.sh

      - name: Locate stability evidence directories
        id: evidence
        if: always()
        run: |
          LATEST=$(ls -td /tmp/ft_audit_stability_5x_* 2>/dev/null | head -1 || echo "")
          if [ -n "$LATEST" ]; then
            echo "dir=$LATEST" >> $GITHUB_OUTPUT
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload audit evidence
        if: always() && steps.evidence.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: f100-audit-stability-evidence-${{ github.run_number }}
          path: ${{ steps.evidence.outputs.dir }}
          retention-days: 90

      - name: Validate docs (optional)
        run: |
          set -euo pipefail
          if [ -f tools/validate_docs.sh ]; then
            bash tools/validate_docs.sh
          else
            echo "[SKIP] tools/validate_docs.sh not found"
          fi
