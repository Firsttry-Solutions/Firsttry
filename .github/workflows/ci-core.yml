name: CI Core - Forge App Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  forge-app-tests:
    name: Forge App Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'atlassian/forge-app/package-lock.json'

      - name: Install dependencies
        working-directory: atlassian/forge-app
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run tests
        working-directory: atlassian/forge-app
        run: npm test

      - name: Validate documentation
        run: |
          if [ -f tools/validate_docs.sh ]; then
            bash tools/validate_docs.sh
          else
            echo "[SKIP] tools/validate_docs.sh not found"
          fi
