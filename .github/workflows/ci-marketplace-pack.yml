name: CI Marketplace Pack (Privacy & Security)

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "atlassian/forge-app/docs/trust/**"
      - "atlassian/forge-app/docs/ops/**"
      - "atlassian/forge-app/tools/marketplace/**"
      - "atlassian/forge-app/tools/realworld/**"
      - ".github/workflows/ci-marketplace-pack.yml"
  push:
    branches: [main]
    paths:
      - "atlassian/forge-app/docs/trust/**"
      - "atlassian/forge-app/docs/ops/**"
      - "atlassian/forge-app/tools/marketplace/**"
      - "atlassian/forge-app/tools/realworld/**"
      - ".github/workflows/ci-marketplace-pack.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  marketplace-pack-verification:
    name: Marketplace Privacy & Security Pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: "atlassian/forge-app/package-lock.json"

      - name: Install dependencies (minimal)
        working-directory: atlassian/forge-app
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci --prefer-offline --no-audit
          else
            echo "Warning: package-lock.json missing, using npm install"
            npm install --no-audit
          fi

      - name: Run REALWORLD gates (prerequisite)
        working-directory: atlassian/forge-app
        run: |
          set -euo pipefail
          bash tools/realworld/run_realworld_gates.sh

      - name: Regenerate trust facts (fail if contacts/policy not filled)
        working-directory: atlassian/forge-app
        run: |
          set -euo pipefail
          bash tools/marketplace/regenerate_trust_facts.sh

      - name: Check for stale generated facts (fail-closed)
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          if [ -n "$(git status --porcelain atlassian/forge-app/docs/trust/)" ]; then
            echo "ERROR: Generated trust facts are stale"
            echo "Changes detected in docs/trust/:"
            git status --porcelain atlassian/forge-app/docs/trust/
            echo ""
            echo "Remediation:"
            echo "  1. Run: cd atlassian/forge-app && bash tools/marketplace/regenerate_trust_facts.sh"
            echo "  2. Review changes: git diff docs/trust/"
            echo "  3. Commit: git add docs/trust/ && git commit -m 'docs: regenerate trust facts'"
            exit 1
          fi
          echo "✓ Generated trust facts are up-to-date"

      - name: Run claims consistency check
        working-directory: atlassian/forge-app
        run: |
          set -euo pipefail
          bash tools/marketplace/verify_claims_consistency.sh /tmp/ft_marketplace_trustfacts_latest/verifiers || {
            echo "ERROR: Claims consistency check failed"
            echo "See /tmp/ft_marketplace_trustfacts_latest/verifiers/02_claims/consistency_report.md"
            exit 1
          }

      - name: Run offline linkability check
        working-directory: atlassian/forge-app
        run: |
          set -euo pipefail
          bash tools/marketplace/build_docs_site_offline.sh /tmp/ft_marketplace_phase3_5_latest || true

      - name: Verify Marketplace Pack (Privacy & Security)
        working-directory: atlassian/forge-app
        run: |
          set -euo pipefail
          bash tools/marketplace/verify_privacy_security_pack.sh

      - name: Locate marketplace pack evidence
        id: evidence
        if: always()
        run: |
          LATEST=$(readlink /tmp/ft_marketplace_pack_latest 2>/dev/null || echo "")
          if [ -n "$LATEST" ] && [ -d "$LATEST" ]; then
            echo "dir=$LATEST" >> $GITHUB_OUTPUT
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Display verdict
        if: always() && steps.evidence.outputs.found == 'true'
        run: |
          echo "============================================"
          echo "Marketplace Pack Verification Verdict"
          echo "============================================"
          cat ${{ steps.evidence.outputs.dir }}/05_verdict/VERDICT.txt || echo "Verdict file not found"

      - name: Upload marketplace pack evidence
        if: always() && steps.evidence.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-pack-evidence-${{ github.run_number }}
          path: ${{ steps.evidence.outputs.dir }}
          retention-days: 30

      - name: Fail if verification rejected
        if: always()
        run: |
          set -euo pipefail
          VERDICT=$(cat /tmp/ft_marketplace_pack_latest/05_verdict/VERDICT.txt 2>/dev/null | head -1 || echo "UNKNOWN")
          if [ "$VERDICT" != "PASS" ]; then
            echo "ERROR: Marketplace pack verification failed (verdict: $VERDICT)"
            echo "See evidence artifact for remediation steps"
            exit 1
          fi
          echo "✓ Marketplace pack verification: PASS"
