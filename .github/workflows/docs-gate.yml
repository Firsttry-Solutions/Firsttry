name: Documentation Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-gate:
    name: Validate Documentation (Required)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run required DOCS validator
        run: bash tools/validate_docs.sh
        shell: bash

      - name: Report validation status
        if: failure()
        run: |
          echo "❌ Documentation validation failed"
          echo "Please ensure:"
          echo "  - All required customer docs exist"
          echo "  - No placeholder terms"
          echo "  - API scopes are documented"
          exit 1

  docs-strict:
    name: Validate Documentation (Strict - Non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run strict DOCS validator
        run: bash tools/validate_docs_strict.sh
        shell: bash

      - name: Report strict validation result
        if: failure()
        run: |
          echo "⚠️  Strict documentation validation reported issues"
          echo "Note: This is non-blocking for CI"
