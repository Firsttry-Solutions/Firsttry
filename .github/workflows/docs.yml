name: Enterprise Documentation Validation & Publish

on:
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

env:
  AUDIT_DIR: /tmp/ft_portal_audit_${{ github.run_number }}

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: npm clean install
        run: npm ci
        working-directory: atlassian/forge-app
      
      - name: Check tooling prerequisites
        run: bash tools/check_tooling_prereqs.sh
        working-directory: atlassian/forge-app
        continue-on-error: true

      - name: Run markdown link checker
        run: node tools/md_link_check.mjs
        working-directory: atlassian/forge-app
      
      - name: Run truth audit (claims register validation)
        run: node tools/truth_claims_gate.mjs
        working-directory: atlassian/forge-app
      
      - name: Run email integrity gate
        run: node tools/email_integrity_gate.mjs
        working-directory: atlassian/forge-app
      
      - name: Run enterprise documentation gate
        run: bash tools/enterprise_docs_gate.sh
        working-directory: atlassian/forge-app

      - name: Build documentation site (enterprise pack - manifest-driven via build_pages_site.mjs)
        # Runs from repo root. Reads pages_pack_manifest.json, copies all publish_dirs
        # into site/, generates site/index.html with version from manifest.
        # No heredoc in YAML - all HTML generation is in build_pages_site.mjs.
        run: node atlassian/forge-app/tools/build_pages_site.mjs

      - name: Smoke proof - list files in site/ after build
        run: |-
          set -euo pipefail
          echo "=== site/ contents after build ==="
          find site -maxdepth 3 -type f | sort
          echo "=== version in index.html ==="
          grep -m1 "Version:" site/index.html || true

      - name: Verify Pages site artifact (fail-closed shape + content policy)
        run: bash atlassian/forge-app/tools/verify_pages_site_artifact.sh ./site

      - name: Audit trust portal source — full (fail-closed per-doc metadata + quality)
        run: node atlassian/forge-app/tools/audit_trust_portal_source_full.mjs
        env:
          AUDIT_DIR: ${{ env.AUDIT_DIR }}

      - name: Upload source audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-source-audit-${{ github.run_number }}
          path: ${{ env.AUDIT_DIR }}/source_audit*

      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload Pages artifact (repo-root site/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live GitHub Pages (fail-closed, 10-min backoff retries)
        run: |
          set -euo pipefail
          # 20 retries × 30s = 10 minutes max for Pages propagation
          MAX_TRIES=20
          SLEEP_SEC=30
          attempt=0
          while true; do
            attempt=$((attempt + 1))
            echo "=== Attempt $attempt / $MAX_TRIES ==="
            if bash atlassian/forge-app/tools/verify_pages_live.sh; then
              echo "Live verification PASSED on attempt $attempt"
              exit 0
            fi
            if [ $attempt -ge $MAX_TRIES ]; then
              echo "FAIL: Live verification failed after $MAX_TRIES attempts (10 min)" >&2
              exit 1
            fi
            echo "Waiting ${SLEEP_SEC}s for GitHub Pages propagation..."
            sleep $SLEEP_SEC
          done

      - name: Audit trust portal live — full (fail-closed per-page version + doc-id + email)
        run: node atlassian/forge-app/tools/audit_trust_portal_live_full.mjs
        env:
          AUDIT_DIR: ${{ env.AUDIT_DIR }}

      - name: Upload live audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-live-audit-${{ github.run_number }}
          path: ${{ env.AUDIT_DIR }}/live_audit*

      - name: Report success
        if: success()
        run: |
          echo "Enterprise Documentation Validation and Publish PASSED"
          echo "Pages URL: https://firsttry-solutions.github.io/Firsttry/"
