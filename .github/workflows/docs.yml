name: Enterprise Documentation Validation & Publish

on:
  push:
    branches: [ main ]
    paths:
      - "atlassian/forge-app/docs/**"
      - ".github/workflows/docs.yml"
      - "CHANGELOG.md"
      - "atlassian/forge-app/docs/CHANGELOG.md"
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: npm clean install
        run: npm ci
        working-directory: atlassian/forge-app
      
      - name: Check tooling prerequisites
        run: bash tools/check_tooling_prereqs.sh
        working-directory: atlassian/forge-app
        continue-on-error: true

      - name: Run markdown link checker
        run: node tools/md_link_check.mjs
        working-directory: atlassian/forge-app
      
      - name: Run truth audit (claims register validation)
        run: node tools/truth_claims_gate.mjs
        working-directory: atlassian/forge-app
      
      - name: Run email integrity gate
        run: node tools/email_integrity_gate.mjs
        working-directory: atlassian/forge-app
      
      - name: Run enterprise documentation gate
        run: bash tools/enterprise_docs_gate.sh
        working-directory: atlassian/forge-app

      - name: Build documentation site (enterprise pack only)
        working-directory: atlassian/forge-app
        run: |
          # Deterministic build: wipe any prior site/ then copy enterprise pack ONLY
          rm -rf site
          mkdir -p site/trust site/operations site/procurement site/evidence

          # Copy enterprise pack directories — NO production/, NO legacy root docs
          cp docs/trust/*.md        site/trust/
          cp docs/operations/*.md   site/operations/
          cp docs/procurement/*.md  site/procurement/
          # evidence may contain subdirs (e.g. baselines/) — preserve structure
          cp -r docs/evidence/.     site/evidence/

          # Generate landing page with direct links to all required files
          cat > site/index.html << 'HTMLEOF'
