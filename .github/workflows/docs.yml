name: Enterprise Documentation Validation & Publish

on:
  push:
    branches: [ main ]
    paths:
      - "atlassian/forge-app/docs/**"
      - ".github/workflows/docs.yml"
      - "CHANGELOG.md"
      - "atlassian/forge-app/docs/CHANGELOG.md"
      - "atlassian/forge-app/tools/verify_pages_site_artifact.sh"
      - "atlassian/forge-app/tools/verify_pages_live.sh"
      - "atlassian/forge-app/tools/pages_pack_manifest.json"
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: npm clean install
        run: npm ci
        working-directory: atlassian/forge-app
      
      - name: Check tooling prerequisites
        run: bash tools/check_tooling_prereqs.sh
        working-directory: atlassian/forge-app
        continue-on-error: true

      - name: Run markdown link checker
        run: node tools/md_link_check.mjs
        working-directory: atlassian/forge-app
      
      - name: Run truth audit (claims register validation)
        run: node tools/truth_claims_gate.mjs
        working-directory: atlassian/forge-app
      
      - name: Run email integrity gate
        run: node tools/email_integrity_gate.mjs
        working-directory: atlassian/forge-app
      
      - name: Run enterprise documentation gate
        run: bash tools/enterprise_docs_gate.sh
        working-directory: atlassian/forge-app

      - name: Build documentation site (enterprise pack only — manifest-driven, repo root site/)
        run: |
          set -euo pipefail
          MANIFEST=atlassian/forge-app/tools/pages_pack_manifest.json

          # Read version from manifest (single source of truth)
          VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('$MANIFEST','utf8')).version)")
          echo "Building site/ for enterprise pack v$VERSION"

          # Deterministic build at repo root — eliminates working-directory ambiguity.
          # Wipe any prior site/ (including legacy _site/ from staticc.yml) then
          # copy ONLY the enterprise pack dirs listed in manifest.publish_dirs.
          rm -rf site _site

          # Create target dirs and copy all publish_dirs from manifest
          node -e "
            const fs = require('fs');
            const path = require('path');
            const m = JSON.parse(fs.readFileSync('$MANIFEST','utf8'));
            const dirs = m.publish_dirs.map(d => ({
              src: d,
              dest: path.join(m.publish_root, path.basename(d))
            }));
            dirs.forEach(({dest}) => process.stdout.write('mkdir -p ' + dest + '\\n'));
            dirs.forEach(({src, dest}) => process.stdout.write('cp -r ' + src + '/. ' + dest + '/\\n'));
          " | bash

          # Generate landing page (version read from manifest above)
          # Write proper index.html with version from manifest
          cat > site/index.html << HTMLEOF
