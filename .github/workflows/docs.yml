HTMLEOF

      - name: Smoke proof - list and assert deployed files
        run: |
          set -euo pipefail
          echo "=== Deployed file listing (site/) ==="
          find atlassian/forge-app/site -maxdepth 2 -type f | sort | head -200

          echo ""
          echo "=== Asserting required files exist ==="
          ERRORS=0
          for f in \
            "atlassian/forge-app/site/trust/SECURITY_OVERVIEW.md" \
            "atlassian/forge-app/site/operations/SLA.md" \
            "atlassian/forge-app/site/procurement/ENTERPRISE_SECURITY_PACK_INDEX.md"; do
            if test -f "$f"; then
              echo "  OK: $f"
            else
              echo "  MISSING: $f" >&2
              ERRORS=1
            fi
          done
          if [ $ERRORS -ne 0 ]; then
            echo "FAIL: Smoke proof — required files missing from site/" >&2
            exit 1
          fi
          echo "PASS: All 3 smoke-proof files present in site/"

      - name: Verify Pages output shape (fail-closed)
        working-directory: atlassian/forge-app
        run: |
          set -euo pipefail
          ERRORS=0

          echo "=== Checking required files exist ==="
          REQUIRED_FILES=(
            "site/trust/SECURITY_OVERVIEW.md"
            "site/trust/RESOLVER_INVENTORY.md"
            "site/trust/SUBPROCESSORS.md"
            "site/operations/SLA.md"
            "site/operations/INCIDENT_RESPONSE_PLAN.md"
            "site/procurement/ENTERPRISE_SECURITY_PACK_INDEX.md"
            "site/procurement/SECURITY_QUESTIONNAIRE_MASTER.md"
            "site/procurement/CONTROL_MAPPING_MATRIX.md"
            "site/evidence/RETENTION_POLICY.md"
            "site/index.html"
          )
          for f in "${REQUIRED_FILES[@]}"; do
            if test -f "$f"; then
              echo "  OK: $f"
            else
              echo "  MISSING: $f" >&2
              ERRORS=1
            fi
          done

          echo ""
          echo "=== Checking forbidden directories do not exist ==="
          FORBIDDEN_DIRS=(
            "site/production"
            "site/dist"
            "site/node_modules"
          )
          for d in "${FORBIDDEN_DIRS[@]}"; do
            if test ! -d "$d"; then
              echo "  OK (absent): $d"
            else
              echo "  FORBIDDEN DIR PRESENT: $d" >&2
              ERRORS=1
            fi
          done

          echo ""
          echo "=== Checking for forbidden placeholder patterns ==="
          PLACEHOLDER_ERRORS=0
          # Literal string patterns
          for pat in 'example.com' 'example.org' '@firsttry.app' '\[Your Jurisdiction\]'; do
            matches=$(grep -RIn "$pat" site/ 2>/dev/null | sort || true)
            if [ -n "$matches" ]; then
              echo "  PLACEHOLDER '$pat' found:" >&2
              echo "$matches" | while IFS= read -r line; do echo "    $line" >&2; done
              PLACEHOLDER_ERRORS=1
              ERRORS=1
            fi
          done
          # Word-boundary tokens (TBD / TODO)
          for tok in '\bTBD\b' '\bTODO\b'; do
            matches=$(grep -RIn -E "$tok" site/ 2>/dev/null | grep -v 'index.html' | sort || true)
            if [ -n "$matches" ]; then
              echo "  PLACEHOLDER token '$tok' found:" >&2
              echo "$matches" | while IFS= read -r line; do echo "    $line" >&2; done
              PLACEHOLDER_ERRORS=1
              ERRORS=1
            fi
          done
          if [ $PLACEHOLDER_ERRORS -eq 0 ]; then
            echo "  OK: No forbidden placeholder patterns found"
          fi

          echo ""
          echo "=== Checking email allowlist compliance ==="
          ALLOWLIST="contact@firsttry.run support@firsttry.run security.contact@firsttry.run privacy@firsttry.run emergency@firsttry.run"
          # Extract all emails from site/ (sorted, unique)
          ALL_EMAILS=$(grep -RInE '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' site/ \
            2>/dev/null \
            | grep -oE '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' \
            | sort -u || true)
          EMAIL_ERRORS=0
          while IFS= read -r email; do
            [ -z "$email" ] && continue
            if echo "$ALLOWLIST" | grep -qw "$email"; then
              echo "  OK: $email"
            else
              echo "  DISALLOWED EMAIL: $email" >&2
              EMAIL_ERRORS=1
              ERRORS=1
            fi
          done <<< "$ALL_EMAILS"
          if [ $EMAIL_ERRORS -eq 0 ]; then
            echo "  OK: All emails are on the approved allowlist"
          fi

          echo ""
          if [ $ERRORS -ne 0 ]; then
            echo "FAIL: Pages output shape verification failed — see errors above" >&2
            exit 1
          fi
          echo "PASS: Pages output shape verified (required files present, forbidden dirs absent, no placeholders, emails clean)"

      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'atlassian/forge-app/site'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live GitHub Pages (fail-closed, with propagation retries)
        run: |
          set -euo pipefail
          MAX_TRIES=6
          SLEEP_SEC=10
          attempt=0
          while true; do
            attempt=$((attempt + 1))
            echo "=== Attempt $attempt / $MAX_TRIES ==="
            if bash atlassian/forge-app/tools/verify_pages_live.sh; then
              echo "Live verification PASSED on attempt $attempt"
              exit 0
            fi
            if [ $attempt -ge $MAX_TRIES ]; then
              echo "FAIL: Live verification failed after $MAX_TRIES attempts" >&2
              exit 1
            fi
            echo "Waiting ${SLEEP_SEC}s for GitHub Pages propagation..."
            sleep $SLEEP_SEC
          done

      - name: Report success
        if: success()
        run: |
          echo "Enterprise Documentation Validation and Publish PASSED"
          echo "Pages URL: https://firsttry-solutions.github.io/Firsttry/"
