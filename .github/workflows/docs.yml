          echo "site/index.html written (v$VERSION)"

      - name: Smoke proof — list and assert required files (manifest-driven)
        run: |
          set -euo pipefail
          MANIFEST=atlassian/forge-app/tools/pages_pack_manifest.json

          echo "=== Deployed file listing (site/) ==="
          find site -maxdepth 3 -type f | sort | head -200

          echo ""
          echo "=== Asserting required files (from manifest) ==="
          ERRORS=0
          while IFS= read -r f; do
            if test -f "$f"; then
              echo "  OK: $f"
            else
              echo "  MISSING: $f" >&2
              ERRORS=1
            fi
          done < <(node -e "
            const m=JSON.parse(require('fs').readFileSync('$MANIFEST','utf8'));
            m.required_files.forEach(f=>console.log(f));
          ")

          if [ $ERRORS -ne 0 ]; then
            echo "FAIL: Smoke proof — required files missing from site/" >&2
            exit 1
          fi
          echo "PASS: All required files present in site/ (manifest-driven)"

      - name: Verify Pages site artifact (fail-closed shape + content policy)
        run: bash atlassian/forge-app/tools/verify_pages_site_artifact.sh ./site

      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload Pages artifact (repo-root site/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live GitHub Pages (fail-closed, 10-min backoff retries)
        run: |
          set -euo pipefail
          # 20 retries × 30s = 10 minutes max for Pages propagation
          MAX_TRIES=20
          SLEEP_SEC=30
          attempt=0
          while true; do
            attempt=$((attempt + 1))
            echo "=== Attempt $attempt / $MAX_TRIES ==="
            if bash atlassian/forge-app/tools/verify_pages_live.sh; then
              echo "Live verification PASSED on attempt $attempt"
              exit 0
            fi
            if [ $attempt -ge $MAX_TRIES ]; then
              echo "FAIL: Live verification failed after $MAX_TRIES attempts (10 min)" >&2
              exit 1
            fi
            echo "Waiting ${SLEEP_SEC}s for GitHub Pages propagation..."
            sleep $SLEEP_SEC
          done

      - name: Report success
        if: success()
        run: |
          echo "Enterprise Documentation Validation and Publish PASSED"
          echo "Pages URL: https://firsttry-solutions.github.io/Firsttry/"
