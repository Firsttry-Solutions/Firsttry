name: Pages Branding Gate

on:
  workflow_dispatch:

jobs:
  branding:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Run Pages branding validator
        run: bash tools/validate_pages_branding.sh
