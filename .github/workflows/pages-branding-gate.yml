name: Pages Branding Gate

on:
  pull_request:
    paths:
      - "docs/**"
      - "tools/validate_pages_branding.sh"
      - ".github/workflows/pages-branding-gate.yml"
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "tools/validate_pages_branding.sh"
      - ".github/workflows/pages-branding-gate.yml"

jobs:
  branding:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Run Pages branding validator
        run: bash tools/validate_pages_branding.sh
