name: CI Policy Gates - Deterministic

on:
  push:
    branches: [main, develop]
    paths:
      - ".github/workflows/policy-gates.yml"
      - "docs/**"
      - "tools/**"
      - "atlassian/forge-app/**"
  pull_request:
    branches: [main, develop]
    paths:
      - ".github/workflows/policy-gates.yml"
      - "docs/**"
      - "tools/**"
      - "atlassian/forge-app/**"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  policy-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install forge-app deps (deterministic)
        working-directory: atlassian/forge-app
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run forge-app tests
        working-directory: atlassian/forge-app
        run: |
          set -euo pipefail
          npm test

      - name: Validate docs (if validator exists)
        run: |
          set -euo pipefail
          if [ -f tools/validate_docs.sh ]; then
            bash tools/validate_docs.sh
          else
            echo "tools/validate_docs.sh not found; skipping."
          fi
