name: CI Policy Gates - Documentation & Compliance Verification

on:
  push:
    branches: [main, develop]
    paths:
      - "docs/**"
      - "audit/**"
      - "atlassian/forge-app/tests/**"
      - ".github/workflows/policy-gates.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "docs/**"
      - "audit/**"
      - "atlassian/forge-app/tests/**"
      - ".github/workflows/policy-gates.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  policy-gates:
    name: Enforce Compliance & Credibility Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: "atlassian/forge-app/package-lock.json"

      - name: Install dependencies (forge-app)
        working-directory: atlassian/forge-app
        run: npm ci

      - name: Run Retention Consistency Tests (MANDATORY)
        working-directory: atlassian/forge-app
        run: |
          set -euo pipefail
          echo "Testing retention policy consistency..."
          npm test -- tests/docs/retention_consistency.test.ts --reporter=verbose
          echo "SUCCESS: Retention policy is consistent"

      - name: Run DPA Language Consistency Tests (MANDATORY)
        working-directory: atlassian/forge-app
        run: |
          set -euo pipefail
          echo "Testing DPA language consistency..."
          npm test -- tests/docs/dpa_language_consistency.test.ts --reporter=verbose
          echo "SUCCESS: DPA language is consistent"

      - name: Run Controller/Processor Consistency Tests (MANDATORY)
        working-directory: atlassian/forge-app
        run: |
          set -euo pipefail
          echo "Testing controller/processor role consistency..."
          npm test -- tests/docs/controller_processor_consistency.test.ts --reporter=verbose
          echo "SUCCESS: Controller/processor roles are correctly stated"

      - name: Run Platform Dependency Disclosure Tests (MANDATORY)
        working-directory: atlassian/forge-app
        run: |
          set -euo pipefail
          echo "Testing platform dependency disclosures..."
          npm test -- tests/docs/platform_dependency_disclosure.test.ts --reporter=verbose
          echo "SUCCESS: Platform dependencies are properly disclosed"

      - name: Run Documentation Compliance Tests (MANDATORY)
        working-directory: atlassian/forge-app
        run: |
          set -euo pipefail
          echo "Running documentation compliance verification..."
          npm test -- tests/docs/ --reporter=verbose
          echo "SUCCESS: All documentation compliance tests passed"

      - name: Verify No Product Code Changes
        run: |
          set -euo pipefail
          echo "Verifying no product code was modified..."
          CHANGED="$(git diff --name-only HEAD^ HEAD 2>/dev/null || true)"
          BAD="$(echo "$CHANGED" | grep -vE '^(docs/|audit/|tests/|\.github/|atlassian/forge-app/tests/)' || true)"
          if [ -n "$BAD" ]; then
            echo "FAILURE: Product code changes detected:"
            echo "$BAD"
            exit 1
          fi
          echo "SUCCESS: Only allowed paths changed"

      - name: Verify Mandatory Docs Exist
        run: |
          set -euo pipefail
          echo "Verifying all mandatory documentation files exist..."
          DOCS=(
            "docs/PRIVACY.md"
            "docs/SECURITY.md"
            "docs/DATA_RETENTION.md"
            "docs/DATA_INVENTORY.md"
            "docs/ACCESS_CONTROL.md"
            "docs/INCIDENT_RESPONSE.md"
            "docs/SUPPORT.md"
            "docs/COMPLIANCE.md"
            "docs/ENTERPRISE_READINESS.md"
            "docs/TERMS.md"
            "docs/CHANGELOG_POLICY.md"
            "docs/SUBPROCESSORS.md"
            "docs/PLATFORM_DEPENDENCIES.md"
          )
          MISSING=0
          for f in "${DOCS[@]}"; do
            if [ ! -f "$f" ]; then
              echo "MISSING: $f"
              MISSING=1
            fi
          done
          if [ "$MISSING" -ne 0 ]; then
            echo "FAILURE: Missing mandatory docs."
            exit 1
          fi
          echo "SUCCESS: All mandatory docs exist"
