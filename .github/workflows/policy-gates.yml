name: CI Policy Gates - Deterministic

on:
  push:
    branches: [main, develop]
    paths:
      - '.github/workflows/policy-gates.yml'
      - 'docs/**'
      - 'tools/**'
      - 'atlassian/forge-app/**'
  pull_request:
    branches: [main, develop]
    paths:
      - '.github/workflows/policy-gates.yml'
      - 'docs/**'
      - 'tools/**'
      - 'atlassian/forge-app/**'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  policy-gates:
    name: Policy Gates - Documentation & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js v18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install forge-app dependencies
        working-directory: atlassian/forge-app
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run forge-app tests
        working-directory: atlassian/forge-app
        run: |
          set -euo pipefail
          npm test || exit 1
          echo "[PASS] All tests passed"

      - name: Validate documentation
        run: |
          set -euo pipefail
          if [ -f tools/validate_docs.sh ]; then
            bash tools/validate_docs.sh
          else
            echo "[SKIP] tools/validate_docs.sh not found"
          fi
