name: CI Policy Gates - Documentation & Compliance Verification

on:
  push:
    branches: [main, develop]
    paths:
      - "docs/**"
      - "audit/**"
      - "atlassian/forge-app/tests/**"
      - ".github/workflows/policy-gates.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "docs/**"
      - "audit/**"
      - "atlassian/forge-app/tests/**"
      - ".github/workflows/policy-gates.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  policy-gates:
    name: Enforce Compliance & Credibility Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install forge-app dependencies (deterministic if lock exists)
        working-directory: atlassian/forge-app
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run documentation-related tests (forge-app)
        working-directory: atlassian/forge-app
        run: |
          set -euo pipefail
          npm test

      - name: Validate enterprise docs (repo-level)
        run: |
          set -euo pipefail
          if [ -f tools/validate_docs.sh ]; then
            bash tools/validate_docs.sh
          else
            echo "tools/validate_docs.sh not present; skipping."
          fi
