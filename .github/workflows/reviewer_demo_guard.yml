name: Reviewer Demo Guard

on:
  push:
    paths:
      - 'tools/**'
      - 'docs/**'
      - 'atlassian/forge-app/docs/**'
      - '.github/workflows/reviewer_demo_guard.yml'
  pull_request:
    paths:
      - 'tools/**'
      - 'docs/**'
      - 'atlassian/forge-app/docs/**'
      - '.github/workflows/reviewer_demo_guard.yml'

jobs:
  reviewer-demo-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert canonical scripts exist and are executable
        run: |
          set -euo pipefail
          req=(
            tools/reviewer_demo/run_reviewer_demo.sh
            tools/reviewer_demo/verify_demo_results.sh
            tools/reviewer_demo/proof_pack/build_reviewer_proof_pack.sh
            tools/reviewer_demo/proof_pack/verify_reviewer_proof_pack.sh
          )
          for f in "${req[@]}"; do
            test -f "$f" || { echo "Missing required script: $f"; exit 1; }
            test -x "$f" || { echo "Script is not executable: $f"; exit 1; }
          done

      - name: Block old reviewer path references
        run: |
          set -euo pipefail
          if rg -n "tools/reviewer/" . \
            --glob '!.github/workflows/reviewer_demo_guard.yml' \
            --glob '!.git/**'; then
            echo "Found forbidden old references to tools/reviewer/"
            exit 1
          fi

      - name: Shellcheck (if available)
        run: |
          set -euo pipefail
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck \
              tools/reviewer_demo/run_reviewer_demo.sh \
              tools/reviewer_demo/verify_demo_results.sh \
              tools/reviewer_demo/proof_pack/build_reviewer_proof_pack.sh \
              tools/reviewer_demo/proof_pack/verify_reviewer_proof_pack.sh \
              tools/reviewer_demo/assert_no_nested_canonical_drift.sh
          else
            echo "shellcheck not available; skipping"
          fi
