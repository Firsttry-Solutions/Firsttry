---
# Atlassian Forge App Manifest - FirstTry Marketplace App
# Dashboard Gadget for Jira Audit Evidence
# Schema: Forge CLI v12+ for Jira Cloud

app:
  id: ari:cloud:ecosystem::app/59d86182-c1c6-49ea-b2fb-6ee5be52b7fc
  description: FirstTry - Audit Evidence Dashboard Gadget for Jira
  runtime:
    name: nodejs20.x

# Modules
modules:
  # Dashboard Gadget (Bundled UI via Vite)
  # REQUIREMENT: Must run as Custom UI resource within Jira dashboard context.
  # Forge bridge (@forge/bridge) is injected by the Jira Custom UI runtime.
  jira:dashboardGadget:
    - key: governance-dashboard-gadget-v2
      title: "FirstTry: Audit Evidence for Jira"
      description: FirstTry Governance - real-time status overview
      resource: govGadget2141
      resolver:
        function: get-status-snapshot-fn
      thumbnail: https://www.atlassian.com/favicon.ico

  # Function modules
  function:
    # Canonical gadget handler: Forge Resolver for all UI invocations
    - key: get-status-snapshot-fn
      handler: gadget-resolver.handler
    # Layer-0 Marketplace: Install trigger handler
    - key: ft-installed-handler
      handler: lifecycle/installed.handler
    # Layer-0 Marketplace: Upgrade trigger handler (CRITICAL: runs on forge install --upgrade)
    - key: ft-upgraded-handler
      handler: lifecycle/upgraded.handler

  # Layer-0 Marketplace: Lifecycle triggers
  trigger:
    - key: ft-installed-trigger
      events:
        - avi:forge:installed:app
      function: ft-installed-handler
    # Layer-0 Marketplace: Upgrade trigger ensures snapshot is seeded/repaired
    - key: ft-upgraded-trigger
      events:
        - avi:forge:upgraded:app
      function: ft-upgraded-handler

# Permissions
permissions:
  scopes:
    - storage:app
    - read:jira-work

# Resources
resources:
  - key: govGadget2141
    path: src/gadget-ui/dist
