      - name: Scan Pages output for placeholder emails
        working-directory: atlassian/forge-app
        run: |
          echo "Checking site/ output for placeholder patterns..."
          if grep -rn -E "example\.com|example\.org|yourcompany|TBD@" site/ 2>/dev/null; then
            echo "Placeholder patterns found in site output!"
            exit 1
          fi
          echo "No placeholder patterns in site output"

          echo "Checking site/ output for disallowed email addresses..."
          grep -roh -E "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}" site/ 2>/dev/null | sed 's|.*:||' | sort -u > /tmp/site_emails.txt || true
          sort -u tools/email_allowlist.txt > /tmp/allowed_emails.txt
          comm -23 /tmp/site_emails.txt /tmp/allowed_emails.txt > /tmp/site_bad_emails.txt || true
          if test -s /tmp/site_bad_emails.txt; then
            echo "Disallowed emails in site output:"
            cat /tmp/site_bad_emails.txt
            exit 1
          fi
          echo "All emails in site output are on the approved allowlist"
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'atlassian/forge-app/site'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      
      - name: Report success
        if: success()
        run: |
          echo "Enterprise Documentation Validation and Publish PASSED"
          echo "Pages URL: https://firsttry-solutions.github.io/Firsttry/"
          echo "Tag: ${{ github.ref }}"
