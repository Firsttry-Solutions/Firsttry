name: Error Envelope Contract Verification

# Non-bypassable CI check for error envelope system integrity
# Verifies that:
# 1. ErrorEnvelopeV1 types are properly defined and exported
# 2. makeErrorEnvelope factory is called in all error paths
# 3. Error envelopes are attached to resolver responses
# 4. UI properly extracts and displays error details
# 5. Type guards prevent invalid data from reaching UI

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - main
      - master
      - develop

permissions:
  contents: read
  pull-requests: read

jobs:
  error-envelope-contract:
    name: Error Envelope Contract Check
    runs-on: ubuntu-latest
    # Non-bypassable: must pass for merge
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: atlassian/forge-app/package-lock.json

      - name: Install dependencies (reproducible from lockfile)
        working-directory: ./atlassian/forge-app
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "ERROR: package-lock.json not found. Reproducible install requires lockfile."
            exit 1
          fi

      - name: Run Error Envelope Contract Verification
        working-directory: ./atlassian/forge-app
        run: |
          echo "Verifying error envelope contract..."
          bash tools/verify_error_envelope_contract.sh
        # NO continue-on-error here - must pass

      - name: Run envelope-related tests
        working-directory: ./atlassian/forge-app
        run: |
          echo "Running error envelope tests..."
          npm test -- \
            tests/invocationMeta.test.ts \
            tests/stepTrace.test.ts \
            tests/errorEnvelope.test.ts \
            tests/invocationEnvelope.test.ts \
            tests/storageProof.test.ts \
            --run
        # Tests must pass

      - name: Type check
        working-directory: ./atlassian/forge-app
        run: |
          npm run type-check
        # Type checking must pass

      - name: Report success
        if: success()
        run: |
          echo "✅ Error envelope contract verified"
          echo "✅ All type guards and validation functions present"
          echo "✅ All resolvers using error envelope system"
          echo "✅ UI properly extracting and displaying error details"
