---
# Atlassian Forge App Manifest - FirstTry Governance Dual Layer
# PHASE 1: Event ingestion endpoint with token auth, validation, idempotency, storage
# PHASE 1.1: Storage proof debug endpoint (admin-only)
# PHASE 3: Scheduled daily/weekly pipelines, run ledgers, readiness gating
# Schema: Forge CLI v12+ for Jira Cloud

app:
  id: ari:cloud:ecosystem::app/59d86182-c1c6-49ea-b2fb-6ee5be52b7fc
  description: FirstTry Governance - Atlassian Dual-Layer Integration
  runtime:
    name: nodejs20.x

function:
    - key: ftBackboneScheduled
      handler: backbone/forge-entry.scheduled
    - key: ftRunNow
      handler: backbone/forge-entry.runNow
    - key: phase5-scheduler-fn
      handler: scheduled/phase5_scheduler.run
    - key: phase6-weekly-snap-fn
      handler: scheduled/snapshot_weekly.handle
    - key: token-refresh-job-fn
      handler: scheduled/token_refresh_scheduler.handle
    - key: daily-dispatcher-fn
      handler: scheduled/scheduler_daily_dispatcher.runDailyDispatch
    - key: status-resolver-fn
      handler: resolvers/governance_status.get
    # Canonical gadget handler: Forge Resolver for all UI invocations (gadget-resolver.ts)
    - key: get-status-snapshot-fn
      handler: gadget-resolver.handler
    - key: refresh-now-fn
      handler: resolvers/gadget-handlers.handler
    - key: get-build-info-fn
      handler: resolvers/gadget-handlers.handler
    - key: export-snap-fn
      handler: resolvers/gadget-handlers.handler
    - key: get-ops-state-fn
      handler: resolvers/gadget-handlers.handler
    # Phase 1 Access Intelligence Resolvers: Run access scan and export pack
    - key: ft-access-v1-fn
      handler: gadget-resolver.handler
    - key: ft-export-v1-fn
      handler: gadget-resolver.handler
    # Diagnostic Probe (Deprecated - Webhooks module not available in Forge v12)
    - key: ft-diag-probe-fn
      handler: diagnostic/probe.handler
    # Layer-0 Marketplace: Install trigger handler
    - key: ft-installed-handler
      handler: lifecycle/installed.handler
    # Layer-0 Marketplace: Upgrade trigger handler (CRITICAL: runs on forge install --upgrade)
    - key: ft-upgraded-handler
      handler: lifecycle/upgraded.handler
    # Layer-0 Debug: Snapshot state endpoint (read-only, for testing)
    - key: debug-snapshot-state-fn
      handler: gadget-resolver.handler
    # ENTERPRISE R2: Phase 6 admin page for evidence ledger + drift history
    - key: phase6-admin-page-fn
      handler: admin/phase6_admin_page.handler
    # PHASE 2: Drift Monitor
    - key: driftMonitorScheduled
      handler: src/continuous-drift/scheduled.run

  # PHASE 3: Scheduled Pipelines (interval-based, valid Forge module)
  # Supported intervals: day, week, hour, minute, fiveMinute
  # PHASE 5: Automatic trigger scheduler (fiveMinute interval to catch thresholds quickly)
  # PHASE 6: Snapshot evidence ledger (daily + weekly automatic captures)
  # SEV-2-003: OAuth token refresh (hourly to maintain freshness)
  # PHASE 2: Config visibility scheduler (daily config complexity snapshot)
  # Layer-0 Backbone: ftBackboneScheduled runs on fiveMinute to maintain ledger
scheduledTrigger:
    - key: ft-backbone-scheduler
      function: ftBackboneScheduled
      interval: fiveMinute

    - key: phase5-auto-scheduler
      function: phase5-scheduler-fn
      interval: hour

    - key: phase6-weekly-snapshot
      function: phase6-weekly-snap-fn
      interval: week

    - key: token-refresh-job
      function: token-refresh-job-fn
      interval: hour

    - key: daily-dispatcher
      function: daily-dispatcher-fn
      interval: day

    # PHASE 2: Continuous Drift Monitor (Daily)
    - key: drift-monitor-daily
      function: driftMonitorScheduled
      interval: day

  # Layer-0 Marketplace: Install trigger creates snapshot anchor
trigger:
    - key: ft-installed-trigger
      events:
        - avi:forge:installed:app
      function: ft-installed-handler
    # Layer-0 Marketplace: Upgrade trigger ensures snapshot is seeded/repaired
    - key: ft-upgraded-trigger
      events:
        - avi:forge:upgraded:app
      function: ft-upgraded-handler

  # Permissions (following module definitions)


permissions:
  scopes:
    - storage:app
    - read:jira-work
    - read:jira-user  # Required for Phase 1: user enumeration and group detection
    - read:jira-project  # PHASE 2: Project permission scheme enumeration
    - read:jira-configuration  # PHASE 2: Jira configuration and permission scheme access
  external:
    fetch:
      backend:
        # PHASE 2: Webhook delivery (Slack-only, or custom relay if customer operates one)
        - 'https://hooks.slack.com'
        # Customer can add their own relay here if they route webhooks to email
        # NO WILDCARDS. NO ARBITRARY DOMAINS.

# Resource pages
resources:
  - key: govGadget2141
    path: src/gadget-ui/dist
