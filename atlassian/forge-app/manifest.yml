---
# Atlassian Forge App Manifest - FirstTry Governance Dual Layer
# PHASE 1: Event ingestion endpoint with token auth, validation, idempotency, storage
# PHASE 1.1: Storage proof debug endpoint (admin-only)
# PHASE 2: Continuous drift monitoring with scheduled triggers
# PHASE 3: Scheduled daily/weekly pipelines, run ledgers, readiness gating
# Schema: Forge CLI v12+ for Jira Cloud

app:
  id: ari:cloud:ecosystem::app/59d86182-c1c6-49ea-b2fb-6ee5be52b7fc
  description: FirstTry Governance - Atlassian Dual-Layer Integration
  runtime:
    name: nodejs20.x

modules:
  # Dashboard Gadget (Custom UI for Jira dashboards)
  jira:dashboardGadget:
    - key: governance-dashboard-gadget-v2
      title: "FirstTry: Audit Evidence for Jira"
      description: FirstTry Governance - real-time status overview
      resource: govGadget2141
      resolver:
        function: get-status-snapshot-fn
      thumbnail: https://www.atlassian.com/favicon.ico

  # PHASE 2: Drift Monitor function
  function:
    - key: driftMonitorScheduled
      handler: continuous-drift/scheduled.run
    - key: get-status-snapshot-fn
      handler: gadget-resolver.handler

  # PHASE 2: Scheduled drift monitor (runs daily)
  scheduledTrigger:
    - key: drift-monitor-daily
      function: driftMonitorScheduled
      interval: day

permissions:
  scopes:
    - read:jira-user
    - read:jira-work
    - read:jira-project
    - read:jira-configuration
    - storage:app

resources:
  - key: govGadget2141
    path: src/gadget-ui/dist
