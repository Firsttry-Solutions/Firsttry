---
# Atlassian Forge App Manifest - FirstTry Governance Dual Layer
# PHASE 1: Event ingestion endpoint with token auth, validation, idempotency, storage
# PHASE 1.1: Storage proof debug endpoint (admin-only)
# PHASE 3: Scheduled daily/weekly pipelines, run ledgers, readiness gating
# Schema: Forge CLI v12+ for Jira Cloud

app:
  id: ari:cloud:ecosystem::app/59d86182-c1c6-49ea-b2fb-6ee5be52b7fc
  description: FirstTry Governance - Atlassian Dual-Layer Integration
  runtime:
    name: nodejs20.x

# Modules
modules:
  # Dashboard Gadget (Bundled UI via Vite)
  # REQUIREMENT: Must run as Custom UI resource within Jira dashboard context.
  # Forge bridge (@forge/bridge) is injected by the Jira Custom UI runtime.
  # If bridge is not available, the gadget will display a fatal error and stop.
  jira:dashboardGadget:
    - key: governance-dashboard-gadget-v2
      title: "Firsttry: Audit Evidence for Jira"
      description: FirstTry Governance - real-time status overview
      resource: govGadget2141
      resolver:
        function: get-status-snapshot-fn
      thumbnail: https://www.atlassian.com/favicon.ico

  # Function modules (PHASE 3: Scheduled pipeline handlers, PHASE 5: Scheduler, PHASE 6: Snapshot evidence ledger, SEV-2-003: OAuth refresh)
  function:
    - key: ftBackboneScheduled
      handler: backbone/forge-entry.scheduled
    - key: ftRunNow
      handler: backbone/forge-entry.runNow
    - key: phase5-scheduler-fn
      handler: scheduled/phase5_scheduler.run
    - key: phase6-weekly-snap-fn
      handler: scheduled/snapshot_weekly.handle
    - key: token-refresh-job-fn
      handler: scheduled/token_refresh_scheduler.handle
    - key: daily-dispatcher-fn
      handler: scheduled/scheduler_daily_dispatcher.runDailyDispatch
    - key: status-resolver-fn
      handler: resolvers/governance_status.get
    # Canonical gadget handler: Single dispatcher for all UI invocations (with allowlist)
    - key: get-status-snapshot-fn
      handler: resolvers/gadget-handlers.handler
    - key: refresh-now-fn
      handler: resolvers/gadget-handlers.handler
    - key: get-build-info-fn
      handler: resolvers/gadget-handlers.handler
    - key: export-snap-fn
      handler: resolvers/gadget-handlers.handler
    - key: get-ops-state-fn
      handler: resolvers/gadget-handlers.handler

  # PHASE 3: Scheduled Pipelines (interval-based, valid Forge module)
  # Supported intervals: day, week, hour, minute, fiveMinute
  # PHASE 5: Automatic trigger scheduler (fiveMinute interval to catch thresholds quickly)
  # PHASE 6: Snapshot evidence ledger (daily + weekly automatic captures)
  # SEV-2-003: OAuth token refresh (hourly to maintain freshness)
  # PHASE 2: Config visibility scheduler (daily config complexity snapshot)
  # Layer-0 Backbone: ftBackboneScheduled runs on fiveMinute to maintain ledger
  scheduledTrigger:
    - key: ft-backbone-scheduler
      function: ftBackboneScheduled
      interval: fiveMinute

    - key: phase5-auto-scheduler
      function: phase5-scheduler-fn
      interval: hour

    - key: phase6-weekly-snapshot
      function: phase6-weekly-snap-fn
      interval: week

    - key: token-refresh-job
      function: token-refresh-job-fn
      interval: hour

    - key: daily-dispatcher
      function: daily-dispatcher-fn
      interval: day

  # Layer-0 Backbone: Web trigger for manual run-now invocations
  webtrigger:
    - key: ftRunNow-web
      function: ftRunNow

# Permissions
permissions:
  scopes:
    - storage:app
    - read:jira-work
  content:
    styles:
      - 'unsafe-inline'

# Resource pages
resources:
  - key: govGadget2141
    path: src/gadget-ui/dist
